<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#e8a04c" />
<title>심바 런 — Simba Run</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0e0a06; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #rotate {
    position: fixed; inset: 0; z-index: 50; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: #0e0a06; color: #f5d089; text-align: center; padding: 24px; gap: 18px;
  }
  #rotate .ico { font-size: 64px; animation: spin 2s ease-in-out infinite; }
  #rotate p { font-size: 18px; line-height: 1.5; opacity: .9; }
  @keyframes spin { 0%,100%{ transform: rotate(0) } 50%{ transform: rotate(90deg) } }
  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="rotate">
  <div class="ico">📱↻</div>
  <p>기기를 <b>가로로</b> 돌려주세요<br/>Rotate your device to landscape</p>
</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ===== 논리 해상도 (가로모드) =====
const W = 900, H = 440;
let scale = 1, offX = 0, offY = 0;
function resize() {
  const vw = innerWidth, vh = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = vw * dpr; canvas.height = vh * dpr;
  canvas.style.width = vw + "px"; canvas.style.height = vh + "px";
  scale = Math.min(vw / W, vh / H);
  offX = (vw - W * scale) / 2; offY = (vh - H * scale) / 2;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize); resize();

// ===== 물리/상수 =====
const PX = 160;                 // 심바의 화면상 고정 x
const GROUND_BASE = 350;        // 기본 지면 y
const MIN_Y = 210, MAX_Y = 384; // 지면 표면 y 허용 범위 (작을수록 높음)
const GRAVITY = 0.9;
const JUMP_V = -15.2;
const BASE_SPEED = 6;
// 클리어 가능 한계: 단일 점프 체공(≈2·|JUMP_V|/G) 동안 최저속도로 나아가는 거리 안에서만 낭떠러지를 생성
const AIRTIME = 2 * Math.abs(JUMP_V) / GRAVITY;      // ≈ 33.8 프레임
const GAP_MIN = 84;
const GAP_MAX = Math.floor(BASE_SPEED * AIRTIME * 0.66); // ≈ 133px (단일 점프로 여유 있게 통과)
const LAND_MIN = 168;           // 위험 직후 안전 착지 지면 최소 폭
const SWIM_STROKE = -6.2;       // 수영 시 탭 한 번의 상승력
const WATER_G = 0.34;           // 물속 중력
const WATER_DRAG = 0.9;
const SIMBA_H = 46;

const State = { READY: 0, PLAY: 1, DEAD: 2 };
let state = State.READY;

// ===== 스테이지 / 바이옴 =====
const STAGES = [
  { name: "주간 초원",   sub: "SAVANNA · DAY",    biome: "day",      len: 3200 },
  { name: "야간 초원",   sub: "SAVANNA · NIGHT",  biome: "night",    len: 3300 },
  { name: "동굴",        sub: "CAVERNS",          biome: "cave",     len: 3200 },
  { name: "킬리만자로",  sub: "KILIMANJARO",      biome: "mountain", len: 3400 },
  { name: "사막",        sub: "DESERT",           biome: "desert",   len: 3600 },
];
let stageIdx = 0, stageStartX = 0, loop = 0, bannerT = 0;

// 바이옴별 지형/적 파라미터 + 팔레트
function biomeCfg(b) {
  switch (b) {
    case "day":      return { gap:.15, water:.12, elev:55, enemy:.48, mix:["hyena","hyena","lion"], sky:["#8fd0ef","#c7ecfb"], grd:["#c9a24a","#8bbf3e"], far:"#a7cf7e", far2:"#8bbd63", accent:"#6bbf4a" };
    case "night":    return { gap:.17, water:.12, elev:62, enemy:.60, mix:["hyena","cheetah","lion","cheetah"], sky:["#0f1c38","#26406b"], grd:["#3b4a2e","#2f5a34"], far:"#20304f", far2:"#182640", accent:"#39623b" };
    case "cave":     return { gap:.30, water:.07, elev:46, enemy:.52, mix:["hyena","snake","lion","snake"], sky:["#171012","#0c0809"], grd:["#4a3b32","#3a2c24"], far:"#241a1c", far2:"#1a1214", accent:"#5a4638" };
    case "mountain": return { gap:.13, water:.05, elev:95, enemy:.44, mix:["lion","hyena","lion"], sky:["#a9d3ee","#eaf5fc"], grd:["#9aa4ac","#e9eef2"], far:"#cfd8de", far2:"#aeb9c1", accent:"#ffffff" };
    case "desert":   return { gap:.09, water:.10, elev:52, enemy:.50, mix:["scorpion","cactus","hyena","scorpion"], sky:["#f6c983","#fbe7b4"], grd:["#e6c07a","#d9a94f"], far:"#e9c584", far2:"#dcae63", accent:"#c98d3a" };
  }
}
function curStage() { return STAGES[stageIdx]; }
function cfg() { return biomeCfg(curStage().biome); }

// ===== 심바 =====
const simba = { y: GROUND_BASE, vy: 0, onGround: true, jumps: 0, run: 0, mode: "land" };

// ===== 월드 =====
let camX = 0;                 // 카메라 왼쪽 월드 x
let genX = 0;                 // 지형 생성 완료 지점
let lastY = GROUND_BASE;      // 다음 세그먼트 시작 지면 y
let lastFeat = "ground";      // 직전 세그먼트 종류 (연속 위험 방지)
let safeX = Infinity;         // 이 월드 x 이전은 평지(안전)
let segs = [];                // 지형 세그먼트
let enemies = [], coins = [], particles = [];
let clouds = [], decors = [], stars = [];
let speed = BASE_SPEED, score = 0, coinScore = 0;
let best = +(localStorage.getItem("simbaBest2") || 0);
let shakeT = 0, deadAt = -999, t = 0;
let paused = false, timeScale = 1;

const playerWX = () => camX + PX;

// ===== 상단 컨트롤 버튼 =====
const BX0 = W / 2 - 90, BY = 12, BW = 40, BH = 34;
const buttons = [
  { id: "pause", x: BX0,       y: BY, w: BW, h: BH },
  { id: "s1",    x: BX0 + 48,  y: BY, w: BW, h: BH, sp: 1 },
  { id: "s2",    x: BX0 + 92,  y: BY, w: BW, h: BH, sp: 2 },
  { id: "s3",    x: BX0 + 136, y: BY, w: BW, h: BH, sp: 3 },
];
function hitButton(lx, ly) {
  for (const b of buttons) if (lx >= b.x && lx <= b.x + b.w && ly >= b.y && ly <= b.y + b.h) return b;
  return null;
}
function pressButton(b) {
  if (b.id === "pause") paused = !paused;
  else { timeScale = b.sp; paused = false; }
}

// ===== 지형 생성 =====
function pushGround(x, w, y0, y1) { segs.push({ type: "ground", x, w, y0, y1 }); }
function groundRamp(w, allowEnemy) {
  const c = cfg();
  let delta = (Math.random() - 0.5) * 2 * c.elev;
  if (curStage().biome === "mountain" && Math.random() < .6) delta = -Math.abs(delta); // 등반 느낌
  const y1 = Math.max(MIN_Y, Math.min(MAX_Y, lastY + delta));
  pushGround(genX, w, lastY, y1);
  // 적 배치: 세그먼트 가운데에만(양끝은 착지/도약 여유) — 단일 점프로 넘을 수 있게 하나만
  if (allowEnemy && w > 160 && Math.random() < c.enemy) {
    const kind = c.mix[(Math.random() * c.mix.length) | 0];
    const ex = genX + w * (0.42 + Math.random() * 0.22);
    const ey = lastY + (y1 - lastY) * ((ex - genX) / w);
    const size = kind === "lion" ? { w: 78, h: 58 } : kind === "cactus" ? { w: 34, h: 56 }
      : kind === "cheetah" ? { w: 68, h: 44 } : kind === "snake" ? { w: 48, h: 40 }
      : kind === "scorpion" ? { w: 52, h: 30 } : { w: 58, h: 38 };
    const vx = kind === "hyena" ? 0.6 : kind === "cheetah" ? 1.5 : kind === "scorpion" ? 0.4 : 0;
    enemies.push({ kind, wx: ex, baseY: ey, y: ey, w: size.w, h: size.h, run: Math.random() * 6, vx });
  }
  if (Math.random() < 0.42) {
    const cx = genX + w * (0.3 + Math.random() * 0.4);
    const cy = lastY + (y1 - lastY) * ((cx - genX) / w) - 34;
    coins.push({ wx: cx, y: cy, r: 11, spin: Math.random() * 6, got: false });
  }
  lastY = y1; genX += w; lastFeat = "ground";
}
function addSegment() {
  const c = cfg();
  // 안전 구간: 평지
  if (genX < safeX) { pushGround(genX, 220, lastY, lastY); genX += 220; lastFeat = "ground"; return; }

  // 위험(낭떠러지/물) 직후에는 반드시 넉넉한 '평평한' 착지 지면 — 적/장애물 없음
  if (lastFeat === "gap" || lastFeat === "water") {
    const w = LAND_MIN + Math.random() * 90;
    pushGround(genX, w, lastY, lastY);   // 수평 착지 → 낭떠러지 양끝 높이 동일
    if (Math.random() < 0.4) coins.push({ wx: genX + w / 2, y: lastY - 34, r: 11, spin: Math.random() * 6, got: false });
    genX += w; lastFeat = "ground"; return;
  }

  const r = Math.random();
  if (r < c.gap) {
    // 낭떠러지 (단일 점프로 통과 가능한 폭으로 제한, 양끝 높이는 동일)
    const w = GAP_MIN + Math.random() * (GAP_MAX - GAP_MIN);
    segs.push({ type: "gap", x: genX, w });
    const cx = genX + w / 2, topY = lastY - 66 - Math.random() * 24;
    for (let i = -1; i <= 1; i++) coins.push({ wx: cx + i * 32, y: topY - Math.abs(i) * 8, r: 11, spin: Math.random() * 6, got: false });
    genX += w; lastFeat = "gap";
  } else if (r < c.gap + c.water) {
    // 물웅덩이 (수영). 폭 제한 + 악어는 가장자리에서 떨어뜨려 진입/탈출 여지 확보
    const w = 160 + Math.random() * 130;
    const surfaceY = Math.min(MAX_Y, lastY + 26);
    segs.push({ type: "water", x: genX, w, surfaceY });
    const n = w > 230 ? 2 : 1;
    for (let i = 0; i < n; i++)
      enemies.push({ kind: "croc", wx: genX + 55 + Math.random() * (w - 110), baseY: surfaceY, y: surfaceY, w: 74, h: 26, run: Math.random() * 6, vx: 0 });
    for (let i = 0; i < 2; i++) coins.push({ wx: genX + w * (0.3 + i * 0.4), y: surfaceY - 46, r: 11, spin: Math.random() * 6, got: false });
    genX += w; lastFeat = "water";
  } else {
    groundRamp(170 + Math.random() * 170, true);
  }
}
function generate() { while (genX < camX + W + 500) addSegment(); }
function cull() {
  const minX = camX - 120;
  segs = segs.filter(s => s.x + s.w > minX);
  enemies = enemies.filter(e => e.wx > minX && !e.dead);
  coins = coins.filter(c => c.wx > minX && !c.got);
}

// 특정 월드 x의 지면 정보
function groundAt(wx) {
  for (const s of segs) {
    if (wx >= s.x && wx < s.x + s.w) {
      if (s.type === "ground") { const k = (wx - s.x) / s.w; return { type: "ground", y: s.y0 + (s.y1 - s.y0) * k }; }
      if (s.type === "water")  return { type: "water", y: s.surfaceY, bottom: s.surfaceY + 132 };
      return { type: "gap" };
    }
  }
  return { type: "ground", y: lastY };
}
const inWater = () => groundAt(playerWX()).type === "water";

// ===== 배경 요소 초기화 =====
function initDecor() {
  clouds = []; for (let i = 0; i < 5; i++) clouds.push({ x: Math.random() * W, y: 30 + Math.random() * 120, s: .6 + Math.random() * .8, sp: .2 + Math.random() * .3 });
  decors = []; for (let i = 0; i < 6; i++) decors.push({ x: Math.random() * W, sc: .7 + Math.random() * .6, seed: Math.random() });
  stars = []; for (let i = 0; i < 60; i++) stars.push({ x: Math.random() * W, y: Math.random() * 240, r: Math.random() * 1.4 + .3, tw: Math.random() * 6 });
}
initDecor();

// ===== 입력: 탭 = 점프(2단) / 수영(스트로크) =====
function doJump() {
  if (state === State.READY) { startGame(); return; }
  if (state === State.DEAD) { if (t - deadAt > 30) resetGame(); return; }
  if (inWater()) {
    simba.vy = SWIM_STROKE; simba.mode = "swim";
    for (let i = 0; i < 5; i++) particles.push({ x: PX, y: simba.y, vx: (Math.random() - .5) * 3, vy: -Math.random() * 3, life: 18, c: "#bfe3ff" });
  } else if (simba.jumps < 2) {
    simba.vy = JUMP_V; simba.onGround = false; simba.jumps++;
    for (let i = 0; i < 6; i++) particles.push({ x: PX, y: simba.y, vx: -1 - Math.random() * 2, vy: 1 - Math.random() * 2, life: 20, c: "#d9b06a" });
  }
}
canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const lx = (e.clientX - r.left - offX) / scale, ly = (e.clientY - r.top - offY) / scale;
  const b = hitButton(lx, ly);
  if (b) { pressButton(b); return; }
  doJump();
}, { passive: false });
addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); doJump(); }
  else if (e.key === "p" || e.key === "P") paused = !paused;
  else if (e.key === "1") { timeScale = 1; paused = false; }
  else if (e.key === "2") { timeScale = 2; paused = false; }
  else if (e.key === "3") { timeScale = 3; paused = false; }
});

// ===== 게임 흐름 =====
function startGame() { state = State.PLAY; safeX = camX + 520; bannerT = 150; generate(); }
function resetGame() {
  state = State.PLAY;
  speed = BASE_SPEED; score = 0; coinScore = 0;
  camX = 0; genX = 0; lastY = GROUND_BASE; lastFeat = "ground"; safeX = 520;
  segs = []; enemies = []; coins = []; particles = [];
  stageIdx = 0; stageStartX = 0; loop = 0; bannerT = 150;
  simba.y = GROUND_BASE; simba.vy = 0; simba.onGround = true; simba.jumps = 0; simba.mode = "land";
  initDecor(); generate();
}
function gameOver() {
  if (state !== State.PLAY) return;
  state = State.DEAD; deadAt = t; shakeT = 18;
  const tot = score + coinScore;
  if (tot > best) { best = tot; localStorage.setItem("simbaBest2", best); }
  for (let i = 0; i < 20; i++) particles.push({ x: PX, y: simba.y - 20, vx: (Math.random() - .5) * 8, vy: -Math.random() * 8, life: 42, c: "#c96a2a" });
}
function stageCheck() {
  if (camX - stageStartX > curStage().len) {
    stageIdx++;
    if (stageIdx >= STAGES.length) { stageIdx = 0; loop++; }
    stageStartX = camX; bannerT = 150;
    safeX = genX + 260; // 스테이지 전환 직후 짧은 평지
  }
}

// ===== 업데이트 =====
function update() {
  t++; if (bannerT > 0) bannerT--; if (shakeT > 0) shakeT--;
  simba.run += state === State.PLAY ? .35 : .2;

  const advancing = state !== State.DEAD;
  if (advancing) {
    const sp = state === State.PLAY ? speed : BASE_SPEED * 0.6;
    camX += inWater() ? sp * 0.82 : sp;
    generate(); cull();
    for (const c of clouds) { c.x -= c.sp * sp * .25; if (c.x < -90) { c.x = W + 60; c.y = 30 + Math.random() * 120; } }
    for (const d of decors) { d.x -= sp * .4; if (d.x < -110) { d.x = W + 80 + Math.random() * 140; d.sc = .7 + Math.random() * .6; d.seed = Math.random(); } }
    for (const s of stars) { s.x -= sp * .08; if (s.x < 0) s.x += W; }
  }

  if (state === State.READY) { simba.y = groundAt(playerWX()).y; updateParticles(); return; }
  if (state === State.DEAD) { updateParticles(); return; }

  // PLAY
  speed += 0.0016 * (1 + loop * 0.25);
  score = Math.floor(camX / 10);

  // 물리
  const gi = groundAt(playerWX());
  if (gi.type === "water") {
    simba.mode = "swim";
    simba.vy += WATER_G; simba.vy *= WATER_DRAG; simba.y += simba.vy;
    simba.onGround = false; simba.jumps = 0;
    if (simba.y < gi.y - 30) simba.y = gi.y - 30;      // 수면 위로 너무 못 튀게
    if (simba.y > gi.bottom) { gameOver(); }             // 바닥까지 가라앉으면 익사
  } else {
    simba.mode = "land";
    simba.vy += GRAVITY; simba.y += simba.vy;
    if (gi.type === "ground") {
      if (simba.y >= gi.y) {
        if (!simba.onGround && simba.vy > 4)
          for (let i = 0; i < 5; i++) particles.push({ x: PX, y: gi.y, vx: -1 - Math.random() * 2, vy: -Math.random() * 2, life: 16, c: "#d9b06a" });
        simba.y = gi.y; simba.vy = 0; simba.onGround = true; simba.jumps = 0;
      } else simba.onGround = false;
    } else { // gap
      simba.onGround = false;
      if (simba.y > H + 90) gameOver();
    }
  }

  // 적/열매 이동
  for (const e of enemies) {
    e.run += .3;
    if (e.vx) e.wx -= e.vx;
    if (e.kind === "croc") e.y = e.baseY + Math.sin(e.run * .4) * 4;
  }
  for (const c of coins) c.spin += .2;

  // 충돌
  const sb = { x: playerWX() - 22, y: simba.y - SIMBA_H, w: 44, h: SIMBA_H - 6 };
  for (const e of enemies) {
    let eb;
    if (e.kind === "cactus") eb = { x: e.wx - 10, y: e.baseY - e.h, w: 20, h: e.h };
    else if (e.kind === "croc") eb = { x: e.wx - e.w / 2 + 6, y: e.y - 12, w: e.w - 12, h: 22 };
    else if (e.kind === "snake" || e.kind === "scorpion") eb = { x: e.wx - e.w / 2 + 6, y: e.baseY - e.h + 6, w: e.w - 12, h: e.h - 8 };
    else eb = { x: e.wx - e.w / 2 + 8, y: e.baseY - e.h + 6, w: e.w - 16, h: e.h - 8 };
    if (aabb(sb, eb)) { gameOver(); break; }
  }
  for (const c of coins) if (!c.got) {
    const dx = playerWX() - c.wx, dy = (simba.y - 22) - c.y;
    if (dx * dx + dy * dy < (c.r + 26) ** 2) {
      c.got = true; coinScore += 5;
      for (let i = 0; i < 8; i++) particles.push({ x: c.wx - camX, y: c.y, vx: (Math.random() - .5) * 4, vy: -Math.random() * 4, life: 24, c: "#ffd85e" });
    }
  }

  stageCheck();
  updateParticles();
}
function updateParticles() { for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += .25; p.life--; } particles = particles.filter(p => p.life > 0); }
function aabb(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

// ================= 그리기 =================
function draw() {
  ctx.save(); ctx.translate(offX, offY); ctx.scale(scale, scale);
  if (shakeT > 0) { const s = shakeT / 18; ctx.translate((Math.random() - .5) * 10 * s, (Math.random() - .5) * 10 * s); }

  const c = cfg(), biome = curStage().biome;
  drawSky(c, biome);
  drawCelestial(biome);
  drawFar(c, biome);
  drawDecor(c, biome);
  drawTerrain(c, biome);
  for (const co of coins) drawCoin(co);
  for (const e of enemies) drawEnemy(e);
  drawSimba();
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life / 32); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 4, 4); }
  ctx.globalAlpha = 1;
  if (biome === "cave") drawCaveCeiling();

  drawHUD();
  if (bannerT > 0) drawBanner();
  if (state === State.READY) drawReady();
  if (state === State.DEAD) drawDead();
  if (paused) drawPausedOverlay();
  drawControls();
  ctx.restore();
}

function drawControls() {
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const b of buttons) {
    const active = b.id === "pause" ? paused : (timeScale === b.sp && !paused);

// ---- 지형 ----

  ctx.restore();

  ctx.fillStyle = "#5f5648"; for (const [dx, dy] of [[-14, bodyY - 2], [-4, bodyY + 2], [4, bodyY - 4], [10, bodyY + 4]]) { ctx.beginPath(); ctx.arc(dx, dy, 2.5, 0, 7); ctx.fill(); }
  ctx.strokeStyle = "#5f5648"; ctx.lineWidth = 2; for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(16 - i * 4, bodyY - 10); ctx.lineTo(18 - i * 4, bodyY - 18); ctx.stroke(); }
  ctx.fillStyle = "#9c8f7d"; ctx.beginPath(); ctx.ellipse(26, bodyY - 2, 12, 9, .2, 0, 7); ctx.fill();
  ctx.fillStyle = "#7d7266"; ctx.beginPath(); ctx.moveTo(22, bodyY - 10); ctx.lineTo(20, bodyY - 20); ctx.lineTo(28, bodyY - 12); ctx.fill();
  ctx.fillStyle = "#b3a794"; ctx.beginPath(); ctx.ellipse(36, bodyY + 2, 8, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#3a3229"; ctx.beginPath(); ctx.arc(42, bodyY + 2, 2.5, 0, 7); ctx.fill();
  ctx.fillStyle = "#d8b100"; ctx.beginPath(); ctx.arc(28, bodyY - 4, 2.6, 0, 7); ctx.fill();
  ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(28.6, bodyY - 4, 1.1, 0, 7); ctx.fill();
  ctx.restore();
}
function drawLion(x, e) {
  const feetY = e.baseY;
  ctx.save(); ctx.translate(x, feetY);
  ctx.fillStyle = "rgba(60,30,8,.3)"; ctx.beginPath(); ctx.ellipse(0, 4, 40, 8, 0, 0, 7); ctx.fill();
  const bodyY = -38, ls = Math.sin(e.run * 1.5) * 11;
  ctx.strokeStyle = "#c98a3a"; ctx.lineWidth = 10; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-18, bodyY + 22); ctx.lineTo(-18 - ls, 0); ctx.moveTo(16, bodyY + 22); ctx.lineTo(16 + ls, 0); ctx.moveTo(-6, bodyY + 22); ctx.lineTo(-6 + ls, 0); ctx.moveTo(26, bodyY + 22); ctx.lineTo(26 - ls, 0); ctx.stroke();
  ctx.strokeStyle = "#c98a3a"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-32, bodyY + 8); ctx.quadraticCurveTo(-52, bodyY, -46, bodyY - 18); ctx.stroke();
  ctx.fillStyle = "#1c140c"; ctx.beginPath(); ctx.arc(-46, bodyY - 20, 6, 0, 7); ctx.fill();
  const bg = ctx.createLinearGradient(0, bodyY, 0, bodyY + 32); bg.addColorStop(0, "#d99640"); bg.addColorStop(1, "#b9772c");
  ctx.fillStyle = bg; rr(-34, bodyY, 58, 34, 15); ctx.fill();
  const hx = 26, hy = bodyY + 2;
  ctx.fillStyle = "#1a1108"; ctx.beginPath();
  for (let i = 0; i <= 12; i++) { const a = -Math.PI * .75 + (i / 12) * Math.PI * 1.5; const r = i % 2 ? 30 : 18; const px = hx + Math.cos(a) * r, py = hy + Math.sin(a) * r; i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py); }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#e0a24a"; ctx.beginPath(); ctx.arc(hx + 4, hy, 16, 0, 7); ctx.fill();
  ctx.fillStyle = "#f0d199"; ctx.beginPath(); ctx.ellipse(hx + 12, hy + 6, 10, 7, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#4a2a10"; ctx.beginPath(); ctx.moveTo(hx + 16, hy + 2); ctx.lineTo(hx + 22, hy + 2); ctx.lineTo(hx + 19, hy + 6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#ffcf3a"; ctx.beginPath(); ctx.arc(hx + 4, hy - 3, 3, 0, 7); ctx.fill();
  ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(hx + 5, hy - 3, 1.4, 0, 7); ctx.fill();
  ctx.strokeStyle = "#1a1108"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(hx - 2, hy - 8); ctx.lineTo(hx + 10, hy - 5); ctx.stroke();
  ctx.restore();
}
function drawCactus(x, e) {
  const feetY = e.baseY;
  ctx.save(); ctx.translate(x, feetY);
  ctx.fillStyle = "rgba(60,30,8,.25)"; ctx.beginPath(); ctx.ellipse(0, 2, 16, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#3e7d3a";
  rr(-9, -e.h, 18, e.h, 9); ctx.fill();
  rr(-28, -e.h + 16, 13, 30, 6); ctx.fill(); ctx.fillRect(-28, -e.h + 16, 24, 13);
  rr(15, -e.h + 6, 13, 34, 6); ctx.fill(); ctx.fillRect(3, -e.h + 6, 24, 13);
  ctx.strokeStyle = "#2c5c2a"; ctx.lineWidth = 2; for (let y = -e.h + 8; y < -6; y += 12) { ctx.beginPath(); ctx.moveTo(-4, y); ctx.lineTo(-4, y + 6); ctx.moveTo(4, y); ctx.lineTo(4, y + 6); ctx.stroke(); }
  ctx.restore();
}
function drawCroc(x, e) {
  ctx.save(); ctx.translate(x, e.y);
  // 물 위로 드러난 등/눈/주둥이
  ctx.fillStyle = "#3f6b3a";
  rr(-e.w / 2, -6, e.w, 12, 6); ctx.fill();
  // 등 비늘
  ctx.fillStyle = "#2f5230"; for (let i = -e.w / 2 + 8; i < e.w / 2 - 6; i += 12) { ctx.beginPath(); ctx.moveTo(i, -6); ctx.lineTo(i + 5, -13); ctx.lineTo(i + 10, -6); ctx.closePath(); ctx.fill(); }
  // 주둥이
  ctx.fillStyle = "#3f6b3a"; rr(e.w / 2 - 6, -4, 22, 9, 4); ctx.fill();
  ctx.strokeStyle = "#e8f0d8"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(e.w / 2 - 4, 1); ctx.lineTo(e.w / 2 + 14, 1); ctx.stroke();
  // 눈
  ctx.fillStyle = "#e8d24a"; ctx.beginPath(); ctx.arc(e.w / 2 - 8, -8, 3, 0, 7); ctx.fill();
  ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(e.w / 2 - 8, -8, 1.3, 0, 7); ctx.fill();
  ctx.restore();
}

// ---- HUD / 오버레이 ----
function drawHUD() {
  const tot = score + coinScore;
  ctx.textAlign = "left";
  ctx.fillStyle = "rgba(0,0,0,.35)"; rr(14, 14, 182, 58, 12); ctx.fill();
  ctx.fillStyle = "#fff4dc"; ctx.font = "bold 24px -apple-system, sans-serif"; ctx.fillText("점수 " + tot, 26, 42);
  ctx.font = "bold 14px -apple-system, sans-serif"; ctx.fillStyle = "rgba(255,244,220,.8)"; ctx.fillText("최고 " + best, 26, 62);
  // 스테이지 표시
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(0,0,0,.35)"; rr(W - 210, 14, 196, 40, 12); ctx.fill();
  ctx.fillStyle = "#ffe6b0"; ctx.font = "bold 16px -apple-system, sans-serif";
  ctx.fillText(`STAGE ${loop * 5 + stageIdx + 1} · ${curStage().name}`, W - 26, 40);
  ctx.textAlign = "left";
}
function drawBanner() {
  const a = Math.min(1, bannerT / 30) * (bannerT > 120 ? (150 - bannerT) / 30 : 1);
  ctx.globalAlpha = Math.max(0, Math.min(1, a));
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(0,0,0,.45)"; rr(W / 2 - 200, H / 2 - 54, 400, 92, 16); ctx.fill();
  ctx.fillStyle = "#fff4dc"; ctx.font = "bold 40px -apple-system, sans-serif";
  ctx.fillText(`STAGE ${loop * 5 + stageIdx + 1}`, W / 2, H / 2 - 10);
  ctx.fillStyle = "#ffd9a0"; ctx.font = "bold 22px -apple-system, sans-serif";
  ctx.fillText(`${curStage().name}  ·  ${curStage().sub}`, W / 2, H / 2 + 22);
  ctx.globalAlpha = 1; ctx.textAlign = "left";
}
function drawReady() {
  dim(.32); ctx.textAlign = "center";
  ctx.fillStyle = "#fff4dc"; ctx.font = "bold 48px -apple-system, sans-serif"; ctx.fillText("심바 런", W / 2, H / 2 - 46);
  ctx.fillStyle = "#ffe6b0"; ctx.font = "bold 20px -apple-system, sans-serif"; ctx.fillText("SIMBA RUN — 5개의 대지를 달려라", W / 2, H / 2 - 16);
  ctx.globalAlpha = .6 + Math.sin(t * .1) * .4; ctx.font = "18px -apple-system, sans-serif"; ctx.fillStyle = "#fff";
  ctx.fillText("👆 탭 = 점프(2단) · 물에선 탭 = 헤엄", W / 2, H / 2 + 20); ctx.globalAlpha = 1;
  ctx.fillStyle = "#ffd9a0"; ctx.font = "15px -apple-system, sans-serif";
  ctx.fillText("낭떠러지는 뛰어넘고, 지형마다 다른 적을 피하라 (치타·뱀·악어·전갈)", W / 2, H / 2 + 48);
  ctx.textAlign = "left";
}
function drawDead() {
  dim(.5); ctx.textAlign = "center";
  ctx.fillStyle = "#ffd9c0"; ctx.font = "bold 46px -apple-system, sans-serif"; ctx.fillText("GAME OVER", W / 2, H / 2 - 24);
  ctx.fillStyle = "#fff4dc"; ctx.font = "bold 22px -apple-system, sans-serif";
  ctx.fillText(`점수 ${score + coinScore}  ·  최고 ${best}`, W / 2, H / 2 + 12);
  ctx.fillStyle = "#ffd9a0"; ctx.font = "16px -apple-system, sans-serif";
  ctx.fillText(`도달: STAGE ${loop * 5 + stageIdx + 1} · ${curStage().name}`, W / 2, H / 2 + 40);
  if (t - deadAt > 30) { ctx.globalAlpha = .55 + Math.sin(t * .12) * .45; ctx.font = "18px -apple-system, sans-serif"; ctx.fillStyle = "#fff"; ctx.fillText("👆 탭하면 처음부터 다시", W / 2, H / 2 + 72); ctx.globalAlpha = 1; }
  ctx.textAlign = "left";
}
function dim(a) { ctx.fillStyle = "rgba(20,10,4," + a + ")"; ctx.fillRect(0, 0, W, H); }

// ---- 유틸 ----
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function shade(hex, d) {
  const n = parseInt(hex.slice(1), 16); let r = (n >> 16) + d, g = ((n >> 8) & 255) + d, b = (n & 255) + d;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

// ---- 디버그 훅 (#debug 일 때만) ----
if (location.hash === "#debug") {
  window.__dbg = {
    goBiome(b) { const i = STAGES.findIndex(s => s.biome === b); if (i >= 0) { stageIdx = i; state = State.PLAY; safeX = camX; } },
    spawn(kind, opts = {}) {
      const gy = groundAt(playerWX() + 260).y;
      const s = kind === "lion" ? [78,58] : kind === "cactus" ? [34,56] : kind === "cheetah" ? [68,44] : kind === "snake" ? [48,40] : kind === "scorpion" ? [52,30] : kind === "croc" ? [74,26] : [58,38];
      enemies.push({ kind, wx: playerWX() + (opts.dx || 260), baseY: gy, y: gy, w: s[0], h: s[1], run: 0, vx: 0 });
    },
    state() { return { stageIdx, biome: curStage().biome, camX, enemies: enemies.length, segs: segs.length, paused, timeScale, scale, offX, offY }; },
    consts() { return { AIRTIME, GAP_MIN, GAP_MAX, LAND_MIN, BASE_SPEED, PX, SIMBA_H }; },
    // 생성기를 강제로 많이 돌려 지형/적을 뽑아 클리어 가능성 불변식 검사용 데이터 반환
    scan(biome, count) {
      const i = STAGES.findIndex(s => s.biome === biome); if (i >= 0) stageIdx = i;
      safeX = camX; // 즉시 위험 생성 허용
      const startSeg = segs.length, startEne = enemies.length;
      const targetX = genX + count;
      while (genX < targetX) addSegment();
      return { segs: segs.slice(startSeg).map(s => ({ ...s })), enemies: enemies.slice(startEne).map(e => ({ kind: e.kind, wx: e.wx, w: e.w, h: e.h })) };
    }
  };
}

// ---- 루프 ----
generate();
function frame() {
  if (!paused) { const n = state === State.PLAY ? timeScale : 1; for (let i = 0; i < n; i++) update(); }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  draw();
  requestAnimationFrame(frame);
}
frame();

})();
</script>
