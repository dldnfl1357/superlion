<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#e8a04c" />
<title>심바 런 — Simba Run</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #1a1208; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* 세로모드일 때 회전 안내 */
  #rotate {
    position: fixed; inset: 0; z-index: 50; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: #1a1208; color: #f5d089; text-align: center; padding: 24px; gap: 18px;
  }
  #rotate .ico { font-size: 64px; animation: spin 2s ease-in-out infinite; }
  #rotate p { font-size: 18px; line-height: 1.5; opacity: .9; }
  @keyframes spin { 0%,100%{ transform: rotate(0) } 50%{ transform: rotate(90deg) } }
  @media (orientation: portrait) and (max-width: 900px) {
    #rotate { display: flex; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="rotate">
  <div class="ico">📱↻</div>
  <p>기기를 <b>가로로</b> 돌려주세요<br/>Rotate your device to landscape</p>
</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ---- 논리 해상도 (가로모드 기준) ----
const W = 900, H = 440;
let scale = 1, offX = 0, offY = 0;

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = vw * dpr;
  canvas.height = vh * dpr;
  canvas.style.width = vw + "px";
  canvas.style.height = vh + "px";
  // 논리 좌표계를 화면에 꽉 차게 (contain)
  scale = Math.min(vw / W, vh / H);
  offX = (vw - W * scale) / 2;
  offY = (vh - H * scale) / 2;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// ---------- 게임 상태 ----------
const GROUND_Y = 360;          // 땅 표면 y
const GRAVITY = 0.9;
const JUMP_V = -15.5;
const BASE_SPEED = 6;

const State = { READY: 0, PLAY: 1, DEAD: 2 };
let state = State.READY;

let speed = BASE_SPEED;
let distance = 0;
let score = 0;
let best = +(localStorage.getItem("simbaBest") || 0);
let shakeT = 0;

// 심바 (주인공)
const simba = {
  x: 150, y: GROUND_Y, w: 62, h: 46,
  vy: 0, onGround: true, jumps: 0, run: 0
};

// 엔티티 배열
let enemies = [];   // 하이에나, 성체 검은사자
let coins = [];     // 반짝이는 열매(코인 역할)
let clouds = [];
let trees = [];     // 배경 아카시아 나무
let grasses = [];   // 앞쪽 풀 장식
let particles = [];

let spawnTimer = 0;
let coinTimer = 0;
let t = 0;

// ---------- 초기 배경 요소 ----------
function initBg() {
  clouds = [];
  for (let i = 0; i < 5; i++) {
    clouds.push({ x: Math.random() * W, y: 40 + Math.random() * 120, s: 0.6 + Math.random() * 0.8, sp: 0.2 + Math.random() * 0.3 });
  }
  trees = [];
  for (let i = 0; i < 4; i++) {
    trees.push({ x: Math.random() * W, sc: 0.7 + Math.random() * 0.6 });
  }
  grasses = [];
  for (let i = 0; i < 14; i++) {
    grasses.push({ x: Math.random() * W, h: 10 + Math.random() * 16 });
  }
}
initBg();

// ---------- 입력: 터치 한 번 = 점프 (최대 2단) ----------
function doJump() {
  if (state === State.READY) { startGame(); return; }
  if (state === State.DEAD) {
    // 죽은 뒤 살짝 기다렸다 재시작 허용
    if (t - deadAt > 30) resetGame();
    return;
  }
  if (simba.jumps < 2) {
    simba.vy = JUMP_V;
    simba.onGround = false;
    simba.jumps++;
    // 점프 먼지
    for (let i = 0; i < 6; i++) {
      particles.push({ x: simba.x, y: simba.y, vx: -1 - Math.random() * 2, vy: 1 - Math.random() * 2, life: 20, c: "#d9b06a" });
    }
  }
}

canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); doJump(); }, { passive: false });
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); doJump(); }
});

// ---------- 게임 흐름 ----------
let deadAt = -999;
function startGame() {
  state = State.PLAY;
}
function resetGame() {
  state = State.PLAY;
  speed = BASE_SPEED;
  distance = 0; score = 0;
  enemies = []; coins = []; particles = [];
  spawnTimer = 60; coinTimer = 90;
  simba.y = GROUND_Y; simba.vy = 0; simba.onGround = true; simba.jumps = 0;
  initBg();
}
function gameOver() {
  state = State.DEAD;
  deadAt = t;
  shakeT = 18;
  if (score > best) { best = score; localStorage.setItem("simbaBest", best); }
  for (let i = 0; i < 18; i++) {
    particles.push({ x: simba.x, y: simba.y - 20, vx: (Math.random() - 0.5) * 8, vy: -Math.random() * 8, life: 40, c: "#c96a2a" });
  }
}

// ---------- 스폰 ----------
function spawnEnemy() {
  // 종류: hyena (작고 낮음), lion (크고 위협적, 성체 검은 갈기)
  const kind = Math.random() < 0.68 ? "hyena" : "lion";
  if (kind === "hyena") {
    enemies.push({ kind, x: W + 40, y: GROUND_Y, w: 58, h: 38, run: 0 });
  } else {
    enemies.push({ kind, x: W + 60, y: GROUND_Y, w: 78, h: 58, run: 0 });
  }
}
function spawnCoin() {
  // 공중 또는 지상 근처 열매
  const high = Math.random() < 0.5;
  const y = high ? GROUND_Y - 90 - Math.random() * 70 : GROUND_Y - 30;
  const n = 1 + (Math.random() * 3 | 0);
  for (let i = 0; i < n; i++) {
    coins.push({ x: W + 30 + i * 34, y, r: 11, spin: Math.random() * 6, got: false });
  }
}

// ---------- 업데이트 ----------
function update() {
  t++;
  if (shakeT > 0) shakeT--;

  // 배경은 항상 흐른다 (READY 화면도 살짝 움직이게)
  const bgSp = state === State.PLAY ? speed : 1.4;
  for (const c of clouds) { c.x -= c.sp * (bgSp * 0.25); if (c.x < -80) { c.x = W + 60; c.y = 40 + Math.random() * 120; } }
  for (const tr of trees) { tr.x -= bgSp * 0.4; if (tr.x < -90) { tr.x = W + 80 + Math.random() * 120; tr.sc = 0.7 + Math.random() * 0.6; } }
  for (const g of grasses) { g.x -= bgSp; if (g.x < -20) { g.x = W + Math.random() * 60; g.h = 10 + Math.random() * 16; } }

  // 심바 달리기 애니메이션
  simba.run += state === State.PLAY ? 0.35 : 0.2;

  if (state !== State.PLAY) {
    // 파티클만 갱신
    updateParticles();
    return;
  }

  // 난이도 상승
  speed += 0.0018;
  distance += speed;
  score = Math.floor(distance / 12);

  // 중력/점프
  simba.vy += GRAVITY;
  simba.y += simba.vy;
  if (simba.y >= GROUND_Y) {
    simba.y = GROUND_Y; simba.vy = 0;
    if (!simba.onGround) {
      // 착지 먼지
      for (let i = 0; i < 5; i++) particles.push({ x: simba.x, y: GROUND_Y, vx: -1 - Math.random() * 2, vy: -Math.random() * 2, life: 16, c: "#d9b06a" });
    }
    simba.onGround = true; simba.jumps = 0;
  }

  // 스폰 타이밍 (속도 오를수록 촘촘)
  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnEnemy();
    const gap = Math.max(46, 96 - (speed - BASE_SPEED) * 5);
    spawnTimer = gap + Math.random() * gap;
  }
  coinTimer--;
  if (coinTimer <= 0) { spawnCoin(); coinTimer = 120 + Math.random() * 120; }

  // 적 이동
  for (const e of enemies) { e.x -= speed; e.run += 0.3; }
  enemies = enemies.filter(e => e.x > -120);

  // 코인 이동
  for (const c of coins) { c.x -= speed; c.spin += 0.2; }
  coins = coins.filter(c => c.x > -40 && !c.got);

  // 충돌 판정 (히트박스는 살짝 관대하게)
  const sb = { x: simba.x - 24, y: simba.y - simba.h, w: 48, h: simba.h - 4 };
  for (const e of enemies) {
    const eb = { x: e.x - e.w / 2 + 8, y: e.y - e.h + 6, w: e.w - 16, h: e.h - 8 };
    if (aabb(sb, eb)) { gameOver(); break; }
  }
  for (const c of coins) {
    if (!c.got) {
      const dx = (simba.x) - c.x, dy = (simba.y - 22) - c.y;
      if (dx * dx + dy * dy < (c.r + 26) * (c.r + 26)) {
        c.got = true; score += 5;
        for (let i = 0; i < 8; i++) particles.push({ x: c.x, y: c.y, vx: (Math.random() - 0.5) * 4, vy: -Math.random() * 4, life: 24, c: "#ffd85e" });
      }
    }
  }

  updateParticles();
}

function updateParticles() {
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life--; }
  particles = particles.filter(p => p.life > 0);
}

function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ================= 그리기 =================
function draw() {
  ctx.save();
  ctx.translate(offX, offY);
  ctx.scale(scale, scale);

  // 화면 흔들림
  if (shakeT > 0) {
    const s = shakeT / 18;
    ctx.translate((Math.random() - 0.5) * 10 * s, (Math.random() - 0.5) * 10 * s);
  }

  drawSky();
  drawSun();
  for (const c of clouds) drawCloud(c);
  drawMountains();
  for (const tr of trees) drawTree(tr);
  drawGround();
  for (const g of grasses) drawGrass(g);

  for (const c of coins) drawCoin(c);
  for (const e of enemies) e.kind === "hyena" ? drawHyena(e) : drawLion(e);
  drawSimba();

  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life / 30); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 4, 4); }
  ctx.globalAlpha = 1;

  drawHUD();

  if (state === State.READY) drawReady();
  if (state === State.DEAD) drawDead();

  ctx.restore();
}

// ---- 배경 ----
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#f6b24a");
  g.addColorStop(0.45, "#f2894a");
  g.addColorStop(0.8, "#e86a3f");
  g.addColorStop(1, "#d9542f");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}
function drawSun() {
  const cx = 720, cy = 130, r = 78;
  const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, r);
  g.addColorStop(0, "#fff2c4");
  g.addColorStop(0.5, "#ffdf7a");
  g.addColorStop(1, "rgba(255,210,110,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff0b8";
  ctx.beginPath(); ctx.arc(cx, cy, 44, 0, Math.PI * 2); ctx.fill();
}
function drawCloud(c) {
  ctx.save();
  ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
  ctx.fillStyle = "rgba(255,240,210,0.55)";
  for (const [dx, dy, r] of [[0,0,20],[24,4,26],[52,2,20],[26,-12,20]]) {
    ctx.beginPath(); ctx.arc(dx, dy, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function drawMountains() {
  ctx.fillStyle = "#c25a34";
  ctx.beginPath();
  ctx.moveTo(0, 320);
  ctx.lineTo(120, 210); ctx.lineTo(240, 300); ctx.lineTo(380, 200);
  ctx.lineTo(520, 300); ctx.lineTo(680, 220); ctx.lineTo(860, 300);
  ctx.lineTo(W, 260); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#a94a2b";
  ctx.beginPath();
  ctx.moveTo(0, 345);
  ctx.lineTo(160, 285); ctx.lineTo(320, 340); ctx.lineTo(500, 280);
  ctx.lineTo(700, 345); ctx.lineTo(W, 300); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  ctx.fill();
}
function drawTree(tr) {
  ctx.save();
  ctx.translate(tr.x, GROUND_Y + 2); ctx.scale(tr.sc, tr.sc);
  // 아카시아 나무 (기린나무)
  ctx.strokeStyle = "#5a3418"; ctx.lineWidth = 7; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -46);
  ctx.moveTo(0, -46); ctx.lineTo(-28, -66);
  ctx.moveTo(0, -46); ctx.lineTo(30, -62);
  ctx.stroke();
  ctx.fillStyle = "#3f6f2e";
  ctx.beginPath(); ctx.ellipse(0, -74, 62, 18, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#4c8437";
  ctx.beginPath(); ctx.ellipse(0, -80, 50, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawGround() {
  const g = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  g.addColorStop(0, "#d99a4e");
  g.addColorStop(1, "#b8763a");
  ctx.fillStyle = g;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  // 땅 표면 라인
  ctx.strokeStyle = "#a5642f"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y + 4); ctx.lineTo(W, GROUND_Y + 4); ctx.stroke();
  // 흐르는 질감 점
  ctx.fillStyle = "rgba(120,70,30,0.25)";
  const off = (distance * 1) % 60;
  for (let x = -off; x < W; x += 60) {
    ctx.fillRect(x, GROUND_Y + 26, 18, 4);
    ctx.fillRect(x + 30, GROUND_Y + 50, 14, 4);
  }
}
function drawGrass(g) {
  ctx.strokeStyle = "#6f4a22"; ctx.lineWidth = 3; ctx.lineCap = "round";
  const x = g.x, y = GROUND_Y + 6;
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x - 4, y - g.h);
  ctx.moveTo(x, y); ctx.lineTo(x, y - g.h - 3);
  ctx.moveTo(x, y); ctx.lineTo(x + 4, y - g.h);
  ctx.stroke();
}

// ---- 코인(열매) ----
function drawCoin(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  const sx = Math.abs(Math.cos(c.spin)) * 0.8 + 0.2;
  ctx.scale(sx, 1);
  const g = ctx.createRadialGradient(-3, -3, 2, 0, 0, c.r);
  g.addColorStop(0, "#fff1a8"); g.addColorStop(1, "#f2a52a");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#c67d16"; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
  // 잎사귀
  ctx.fillStyle = "#4c8437";
  ctx.beginPath(); ctx.ellipse(c.x + 2, c.y - c.r - 2, 5, 3, -0.6, 0, Math.PI * 2); ctx.fill();
}

// ---- 심바 (사자 새끼, 황금색) ----
function drawSimba() {
  const bob = Math.sin(simba.run) * (simba.onGround ? 2.5 : 0);
  const cx = simba.x, feetY = simba.y;
  ctx.save();
  ctx.translate(cx, feetY);

  // 그림자
  ctx.fillStyle = "rgba(80,40,10,0.25)";
  const shScale = simba.onGround ? 1 : 0.6;
  ctx.beginPath(); ctx.ellipse(0, 4, 30 * shScale, 7 * shScale, 0, 0, Math.PI * 2); ctx.fill();

  const bodyY = -30 + bob;
  // 다리 (달리는 애니)
  const legSwing = simba.onGround ? Math.sin(simba.run * 1.6) * 10 : 6;
  ctx.strokeStyle = "#d98e2b"; ctx.lineWidth = 8; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-14, bodyY + 18); ctx.lineTo(-14 - legSwing, 0);
  ctx.moveTo(14, bodyY + 18); ctx.lineTo(14 + legSwing, 0);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-6, bodyY + 18); ctx.lineTo(-6 + legSwing, 0);
  ctx.moveTo(22, bodyY + 18); ctx.lineTo(22 - legSwing, 0);
  ctx.stroke();

  // 꼬리
  ctx.strokeStyle = "#e0972f"; ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(-24, bodyY + 6);
  ctx.quadraticCurveTo(-44, bodyY - 4 + Math.sin(simba.run) * 4, -40, bodyY - 20);
  ctx.stroke();
  ctx.fillStyle = "#8a4a1c";
  ctx.beginPath(); ctx.arc(-40, bodyY - 22, 5, 0, Math.PI * 2); ctx.fill();

  // 몸통
  const bg = ctx.createLinearGradient(0, bodyY - 8, 0, bodyY + 22);
  bg.addColorStop(0, "#f6b64a"); bg.addColorStop(1, "#e2942d");
  ctx.fillStyle = bg;
  roundRect(-26, bodyY, 46, 26, 13); ctx.fill();

  // 머리
  const hx = 22, hy = bodyY - 4;
  ctx.fillStyle = "#f6b84c";
  ctx.beginPath(); ctx.arc(hx, hy, 18, 0, Math.PI * 2); ctx.fill();
  // 귀
  ctx.fillStyle = "#e2942d";
  ctx.beginPath(); ctx.arc(hx - 10, hy - 15, 6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(hx + 10, hy - 15, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#7a3f18";
  ctx.beginPath(); ctx.arc(hx - 10, hy - 15, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(hx + 10, hy - 15, 3, 0, Math.PI * 2); ctx.fill();
  // 새끼사자 갈기 힌트 (머리 위 붉은 털)
  ctx.fillStyle = "#c9622a";
  ctx.beginPath(); ctx.moveTo(hx - 4, hy - 16); ctx.quadraticCurveTo(hx + 2, hy - 30, hx + 8, hy - 16); ctx.fill();
  // 주둥이
  ctx.fillStyle = "#ffe6b0";
  ctx.beginPath(); ctx.ellipse(hx + 8, hy + 6, 10, 8, 0, 0, Math.PI * 2); ctx.fill();
  // 코
  ctx.fillStyle = "#6e3a18";
  ctx.beginPath(); ctx.moveTo(hx + 14, hy + 2); ctx.lineTo(hx + 20, hy + 2); ctx.lineTo(hx + 17, hy + 6); ctx.closePath(); ctx.fill();
  // 눈
  ctx.fillStyle = "#2a1607";
  ctx.beginPath(); ctx.arc(hx + 6, hy - 2, 2.4, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

// ---- 하이에나 (적) ----
function drawHyena(e) {
  const cx = e.x, feetY = e.y;
  ctx.save();
  ctx.translate(cx, feetY);
  // 그림자
  ctx.fillStyle = "rgba(80,40,10,0.25)";
  ctx.beginPath(); ctx.ellipse(0, 4, 28, 6, 0, 0, Math.PI * 2); ctx.fill();

  const bodyY = -26;
  const legSwing = Math.sin(e.run * 1.6) * 8;
  // 다리
  ctx.strokeStyle = "#7d7266"; ctx.lineWidth = 6; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-12, bodyY + 14); ctx.lineTo(-12 - legSwing, 0);
  ctx.moveTo(12, bodyY + 14); ctx.lineTo(12 + legSwing, 0);
  ctx.moveTo(-4, bodyY + 14); ctx.lineTo(-4 + legSwing, 0);
  ctx.moveTo(18, bodyY + 14); ctx.lineTo(18 - legSwing, 0);
  ctx.stroke();
  // 몸통 (등이 높은 하이에나 실루엣)
  ctx.fillStyle = "#8a7d6d";
  ctx.beginPath();
  ctx.moveTo(-24, bodyY + 12);
  ctx.quadraticCurveTo(-26, bodyY - 10, -6, bodyY - 10);
  ctx.quadraticCurveTo(10, bodyY - 14, 24, bodyY + 2);
  ctx.quadraticCurveTo(20, bodyY + 12, -24, bodyY + 12);
  ctx.fill();
  // 얼룩 반점
  ctx.fillStyle = "#5f5648";
  for (const [dx, dy] of [[-14, bodyY - 2], [-4, bodyY + 2], [4, bodyY - 4], [10, bodyY + 4]]) {
    ctx.beginPath(); ctx.arc(dx, dy, 2.5, 0, Math.PI * 2); ctx.fill();
  }
  // 목 갈기 (거친 털)
  ctx.strokeStyle = "#5f5648"; ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath(); ctx.moveTo(16 - i * 4, bodyY - 10); ctx.lineTo(18 - i * 4, bodyY - 18); ctx.stroke();
  }
  // 머리
  ctx.fillStyle = "#9c8f7d";
  ctx.beginPath(); ctx.ellipse(26, bodyY - 2, 12, 9, 0.2, 0, Math.PI * 2); ctx.fill();
  // 귀
  ctx.fillStyle = "#7d7266";
  ctx.beginPath(); ctx.moveTo(22, bodyY - 10); ctx.lineTo(20, bodyY - 20); ctx.lineTo(28, bodyY - 12); ctx.fill();
  // 주둥이
  ctx.fillStyle = "#b3a794";
  ctx.beginPath(); ctx.ellipse(36, bodyY + 2, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#3a3229";
  ctx.beginPath(); ctx.arc(42, bodyY + 2, 2.5, 0, Math.PI * 2); ctx.fill();
  // 눈 (사악하게)
  ctx.fillStyle = "#d8b100";
  ctx.beginPath(); ctx.arc(28, bodyY - 4, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.arc(28.6, bodyY - 4, 1.1, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---- 성체 검은 갈기 숫사자 (강한 적) ----
function drawLion(e) {
  const cx = e.x, feetY = e.y;
  ctx.save();
  ctx.translate(cx, feetY);
  // 그림자
  ctx.fillStyle = "rgba(80,40,10,0.3)";
  ctx.beginPath(); ctx.ellipse(0, 4, 40, 8, 0, 0, Math.PI * 2); ctx.fill();

  const bodyY = -38;
  const legSwing = Math.sin(e.run * 1.5) * 11;
  // 다리
  ctx.strokeStyle = "#c98a3a"; ctx.lineWidth = 10; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-18, bodyY + 22); ctx.lineTo(-18 - legSwing, 0);
  ctx.moveTo(16, bodyY + 22); ctx.lineTo(16 + legSwing, 0);
  ctx.moveTo(-6, bodyY + 22); ctx.lineTo(-6 + legSwing, 0);
  ctx.moveTo(26, bodyY + 22); ctx.lineTo(26 - legSwing, 0);
  ctx.stroke();
  // 꼬리
  ctx.strokeStyle = "#c98a3a"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-32, bodyY + 8);
  ctx.quadraticCurveTo(-52, bodyY, -46, bodyY - 18); ctx.stroke();
  ctx.fillStyle = "#1c140c";
  ctx.beginPath(); ctx.arc(-46, bodyY - 20, 6, 0, Math.PI * 2); ctx.fill();
  // 몸통
  const bg = ctx.createLinearGradient(0, bodyY, 0, bodyY + 32);
  bg.addColorStop(0, "#d99640"); bg.addColorStop(1, "#b9772c");
  ctx.fillStyle = bg;
  roundRect(-34, bodyY, 58, 34, 15); ctx.fill();

  // 검은 갈기 (성체 숫사자의 상징)
  const hx = 26, hy = bodyY + 2;
  ctx.fillStyle = "#1a1108";
  // 갈기 삐죽삐죽
  ctx.beginPath();
  const spikes = 12, R1 = 30, R2 = 18;
  for (let i = 0; i <= spikes; i++) {
    const a = -Math.PI * 0.75 + (i / spikes) * Math.PI * 1.5;
    const r = i % 2 ? R1 : R2;
    const px = hx + Math.cos(a) * r, py = hy + Math.sin(a) * r;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  // 얼굴
  ctx.fillStyle = "#e0a24a";
  ctx.beginPath(); ctx.arc(hx + 4, hy, 16, 0, Math.PI * 2); ctx.fill();
  // 주둥이
  ctx.fillStyle = "#f0d199";
  ctx.beginPath(); ctx.ellipse(hx + 12, hy + 6, 10, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#4a2a10";
  ctx.beginPath(); ctx.moveTo(hx + 16, hy + 2); ctx.lineTo(hx + 22, hy + 2); ctx.lineTo(hx + 19, hy + 6); ctx.closePath(); ctx.fill();
  // 사나운 눈
  ctx.fillStyle = "#ffcf3a";
  ctx.beginPath(); ctx.arc(hx + 4, hy - 3, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.arc(hx + 5, hy - 3, 1.4, 0, Math.PI * 2); ctx.fill();
  // 눈썹 (화난 표정)
  ctx.strokeStyle = "#1a1108"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(hx - 2, hy - 8); ctx.lineTo(hx + 10, hy - 5); ctx.stroke();
  ctx.restore();
}

// ---- HUD ----
function drawHUD() {
  ctx.fillStyle = "#4a2810";
  ctx.font = "bold 26px -apple-system, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("점수 " + score, 24, 42);
  ctx.font = "bold 16px -apple-system, sans-serif";
  ctx.fillStyle = "rgba(74,40,16,0.75)";
  ctx.fillText("최고 " + best, 24, 66);
}

function drawReady() {
  dim(0.35);
  ctx.textAlign = "center";
  ctx.fillStyle = "#fff4dc";
  ctx.font = "bold 46px -apple-system, sans-serif";
  ctx.fillText("심바 런", W / 2, H / 2 - 30);
  ctx.font = "bold 20px -apple-system, sans-serif";
  ctx.fillStyle = "#ffe6b0";
  ctx.fillText("SIMBA RUN — 프라이드랜드를 달려라!", W / 2, H / 2 + 2);
  ctx.font = "18px -apple-system, sans-serif";
  const pulse = 0.6 + Math.sin(t * 0.1) * 0.4;
  ctx.globalAlpha = pulse;
  ctx.fillText("👆 화면을 탭하면 점프 (2단 점프 가능)", W / 2, H / 2 + 40);
  ctx.globalAlpha = 1;
  ctx.font = "16px -apple-system, sans-serif";
  ctx.fillStyle = "#ffd9a0";
  ctx.fillText("하이에나와 검은 갈기 사자를 피하고 열매를 먹어라", W / 2, H / 2 + 70);
}

function drawDead() {
  dim(0.5);
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffd9c0";
  ctx.font = "bold 44px -apple-system, sans-serif";
  ctx.fillText("GAME OVER", W / 2, H / 2 - 20);
  ctx.fillStyle = "#fff4dc";
  ctx.font = "bold 24px -apple-system, sans-serif";
  ctx.fillText("점수 " + score + "   ·   최고 " + best, W / 2, H / 2 + 16);
  if (t - deadAt > 30) {
    const pulse = 0.55 + Math.sin(t * 0.12) * 0.45;
    ctx.globalAlpha = pulse;
    ctx.font = "18px -apple-system, sans-serif";
    ctx.fillText("👆 탭하면 다시 시작", W / 2, H / 2 + 54);
    ctx.globalAlpha = 1;
  }
}

function dim(a) { ctx.fillStyle = "rgba(30,15,5," + a + ")"; ctx.fillRect(0, 0, W, H); }

// ---- 유틸 ----
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---- 루프 ----
function loop() {
  update();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  draw();
  requestAnimationFrame(loop);
}
loop();

})();
</script>
